<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <!-- Main login card -->
    <div class="auth-container">
        <!-- Title -->
        <div class="auth-header">
            <h1>Smart Pantry</h1>
            <p class="tagline">Reduce food waste. Eat smarter.</p>
        </div>

        <!-- Login form -->
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <!-- Error message shows up here if login fails -->
            <div id="errorMsg" class="error-msg"></div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="register.html">Sign up</a>
        </p>
    </div>

    <!-- Login script -->
    <script>
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();  // stop default form submit

            // Grab values from the form
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            try {
                // Call the /api/login endpoint
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Save user info in localStorage so other pages know who is logged in
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('username', data.username);
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                }
            } catch (err) {
                errorMsg.textContent = 'Could not connect to server';
            }
        });
    </script>
</body>
</html>
